name: Build site

# Rebuilds blog pages, gallery, sitemap and image sizes whenever content changes
# (for example after publishing from Pages CMS), then commits the result.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "uploads/**"
      - "gallery/**"
      - "assets/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml pillow
      - run: python scripts/build.py
      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to update"; exit 0; fi
          git commit -m "Build site from content"
          git push
